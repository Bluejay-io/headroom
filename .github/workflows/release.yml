name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Headroom.app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Zip
        run: ditto -c -k --keepParent dist/Headroom.app dist/Headroom.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Headroom.zip --title "Headroom $GITHUB_REF_NAME" --generate-notes
